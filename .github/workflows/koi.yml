name: Koi

on:
  schedule:
    - cron: '5 0 * * *' # Käivitub iga öö natuke pärast keskööd UTC
  workflow_dispatch:      # Võimaldab skripti käsitsi käivitada
  push:
    paths:
      - '.github/workflows/koi.yml'

jobs:
  koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white # Saad siin muuta kala mustrit (nt white, black, asagi, tea, gold, platinum)
      - name: Commit koi
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update koi
          file_pattern: koi/*
